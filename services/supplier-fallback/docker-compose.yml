services:
  supplier-fallback:
    build:
      context: ..
      dockerfile: supplier-fallback/.docker/Dockerfile
    ports:
      - "${SUPPLIER_FALLBACK_PORT}:${SUPPLIER_FALLBACK_PORT}"
    environment:
      PORT: "${SUPPLIER_FALLBACK_PORT}"
      ERROR_RATE: "${SUPPLIER_FALLBACK_ERROR_RATE}"
      TIMEOUT_RATE: "${SUPPLIER_FALLBACK_TIMEOUT_RATE}"
      TIMEOUT_SECONDS: "${SUPPLIER_FALLBACK_TIMEOUT_SECONDS}"
      DUPLICATE_CODE_RATE: "${SUPPLIER_FALLBACK_DUPLICATE_CODE_RATE:-0}"
      WRONG_CODE_RATE: "${SUPPLIER_FALLBACK_WRONG_CODE_RATE:-0}"
      LIE_ERROR_RATE: "${SUPPLIER_FALLBACK_LIE_ERROR_RATE:-0}"
      RATE_LIMIT_PER_MINUTE: "${SUPPLIER_FALLBACK_RATE_LIMIT_PER_MINUTE:-0}"
    networks:
      - store

networks:
  store:
    name: ${COMPOSE_NETWORK}
