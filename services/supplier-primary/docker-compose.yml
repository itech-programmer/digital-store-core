services:
  supplier-primary:
    build:
      context: ..
      dockerfile: supplier-primary/.docker/Dockerfile
    ports:
      - "${SUPPLIER_PRIMARY_PORT}:${SUPPLIER_PRIMARY_PORT}"
    environment:
      PORT: "${SUPPLIER_PRIMARY_PORT}"
      ERROR_RATE: "${SUPPLIER_PRIMARY_ERROR_RATE}"
      TIMEOUT_RATE: "${SUPPLIER_PRIMARY_TIMEOUT_RATE}"
      TIMEOUT_SECONDS: "${SUPPLIER_PRIMARY_TIMEOUT_SECONDS}"
      DUPLICATE_CODE_RATE: "${SUPPLIER_PRIMARY_DUPLICATE_CODE_RATE:-0}"
      WRONG_CODE_RATE: "${SUPPLIER_PRIMARY_WRONG_CODE_RATE:-0}"
      LIE_ERROR_RATE: "${SUPPLIER_PRIMARY_LIE_ERROR_RATE:-0}"
      RATE_LIMIT_PER_MINUTE: "${SUPPLIER_PRIMARY_RATE_LIMIT_PER_MINUTE:-0}"
    networks:
      - store

networks:
  store:
    name: ${COMPOSE_NETWORK}
